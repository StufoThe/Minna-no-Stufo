/* ============================================================================
   1. ZEN WEB AUDIO ENGINE (Soft, non-fatiguing game chimes)
============================================================================ */
const ZenAudio = (() => {
  let ctx = null;
  function init() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type = 'sine', gainVal = 0.06, delay = 0) {
    if (!AppState.soundOn) return;
    try {
      init();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(gainVal, ctx.currentTime + delay + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + dur + 0.02);
    } catch (e) {}
  }
  return {
    correct(combo = 1) {
      const base = Math.min(523.25 + combo * 22, 780);
      tone(base, 0.14, 'triangle', 0.06, 0);
      tone(base * 1.25, 0.2, 'sine', 0.055, 0.08);
    },
    wrong() {
      tone(220, 0.16, 'sine', 0.05, 0);
      tone(196, 0.2, 'sine', 0.04, 0.09);
    },
    flip() {
      tone(420, 0.07, 'sine', 0.03, 0);
    },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.055, i * 0.08));
    }
  };
})();

const STORAGE_KEY = 'pm_godtier_dojo_v51';

const DefaultState = {
  tab: 'arena',         // 'arena' | 'exams' | 'cheatsheet'
  lang: 'bi',           // 'bi' (JP+ID) | 'jp' | 'id'
  soundOn: true,

  unlockAllSteps: false,
  cardSeen: {},         // cardId -> true
  qMastery: {},         // qId -> 0..3 (2+ = mastered)
  qWrongPool: [],       // array of qIds missed recently for Smart Queue
  bankStats: {
    bank1: { best: null, attempts: 0, lastWrong: [] },
    bank2: { best: null, attempts: 0, lastWrong: [] },
    bank3: { best: null, attempts: 0, lastWrong: [] }
  }
};

let AppState = loadState();
let ActiveSession = null; // For Arena Stage / Smart Queue or Exam Session
let ExamTimerId = null;
let CheatFilter = 'all';
let AllergenSearch = '';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DefaultState));
    const parsed = JSON.parse(raw);
    return {
      ...JSON.parse(JSON.stringify(DefaultState)),
      ...parsed,
      bankStats: { ...JSON.parse(JSON.stringify(DefaultState.bankStats)), ...(parsed.bankStats || {}) }
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(DefaultState));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
  } catch (e) {}
}

function getLevel(xp) {
  return Math.floor(xp / 120) + 1;
}

function getStageStats(stageId) {
  const stageQs = ALL_QUESTIONS.filter(q => q.stage === stageId);
  const mastered = stageQs.filter(q => (AppState.qMastery[q.id] || 0) >= 2).length;
  const stageCards = MICRO_CARDS.filter(c => c.stage === stageId);
  const seenCards = stageCards.filter(c => AppState.cardSeen[c.id]).length;
  const pct = Math.round(((mastered + seenCards) / (stageQs.length + stageCards.length)) * 100);
  return { totalQ: stageQs.length, mastered, totalC: stageCards.length, seenCards, pct };
}

function getCompletedStepCount() {
  return GUIDED_STEPS.filter(st => AppState.completedSteps && AppState.completedSteps[st.id]).length;
}

function getNextStepId() {
  const next = GUIDED_STEPS.find(st => !(AppState.completedSteps && AppState.completedSteps[st.id]));
  return next ? next.id : 10;
}

function getOverallReadiness() {
  const stepScore = (getCompletedStepCount() / GUIDED_STEPS.length) * 50;
  const masteredQ = ALL_QUESTIONS.filter(q => (AppState.qMastery[q.id] || 0) >= 1).length;
  const qScore = (masteredQ / ALL_QUESTIONS.length) * 50;
  return Math.min(100, Math.round(stepScore + qScore));
}

function addXp(amount, label) {
  AppState.xp += amount;
  saveState();
  updateHud();
  showToast(`+${amount} XP ${label || ''}`, 'amber');
}

function showToast(msg, color = 'sky') {
  const area = document.getElementById('toast-area');
  if (!area) return;
  const colors = {
    sky: 'border-sky-500/40 bg-night-800/95 text-sky-200',
    emerald: 'border-emerald-500/40 bg-night-800/95 text-emerald-200',
    amber: 'border-amber-500/40 bg-night-800/95 text-amber-200',
    rose: 'border-rose-500/40 bg-night-800/95 text-rose-200'
  };
  const el = document.createElement('div');
  el.className = `px-3.5 py-2 rounded-xl border text-xs font-semibold shadow-xl animate-pop ${colors[color] || colors.sky}`;
  el.textContent = msg;
  area.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.25s';
    setTimeout(() => el.remove(), 260);
  }, 1900);
}

const FURIGANA_MAP = Object.fromEntries(HARD_FURIGANA);
const FURIGANA_REGEX = new RegExp(HARD_FURIGANA.map(([k]) => k).join('|'), 'g');

function addFurigana(str) {
  const safe = escapeHtml(str);
  return safe.replace(FURIGANA_REGEX, match => {
    const rt = FURIGANA_MAP[match];
    return rt ? `<ruby>${match}<rt>${rt}</rt></ruby>` : match;
  });
}

function formatText(jp, id) {
  if (AppState.lang === 'jp') return `<span class="font-jp">${addFurigana(jp)}</span>`;
  if (AppState.lang === 'id') return `<span>${escapeHtml(id)}</span>`;
  return `<span class="font-jp block text-slate-100">${addFurigana(jp)}</span><span class="block text-xs sm:text-sm text-slate-400 mt-0.5">${escapeHtml(id)}</span>`;
}

function formatOption(opt) {
  if (AppState.lang === 'jp') return `<span class="font-jp">${addFurigana(opt.jp)}</span>`;
  if (AppState.lang === 'id') return `<span>${escapeHtml(opt.id)}</span>`;
  return `<span class="font-jp block text-slate-100 text-sm">${addFurigana(opt.jp)}</span><span class="block text-xs text-slate-400 mt-0.5">${escapeHtml(opt.id)}</span>`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function clearExamTimer() {
  if (ExamTimerId) {
    clearInterval(ExamTimerId);
    ExamTimerId = null;
  }
}

/* ============================================================================
   5. HUD & NAVIGATION
============================================================================ */
function updateHud() {
  const lvlEl = document.getElementById('stat-lvl');
  const xpEl = document.getElementById('stat-xp');
  const comboEl = document.getElementById('stat-combo');
  const langBtn = document.getElementById('btn-lang');
  const soundBtn = document.getElementById('btn-sound');

  if (lvlEl) lvlEl.textContent = `Lv.${getLevel(AppState.xp)}`;
  if (xpEl) xpEl.textContent = `${AppState.xp} XP`;
  if (comboEl) comboEl.textContent = AppState.combo;
  if (langBtn) {
    langBtn.textContent = AppState.lang === 'bi' ? 'JP + ID' : (AppState.lang === 'jp' ? '日本語' : 'INDONESIA');
  }
  if (soundBtn) soundBtn.textContent = AppState.soundOn ? '🔊' : '🔇';

  document.querySelectorAll('.nav-tab').forEach(btn => {
    const active = btn.dataset.tab === AppState.tab;
    btn.className = `nav-tab py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5 ${

        : 'text-slate-400 hover:text-slate-200 hover:bg-night-800/70 border border-transparent'
    }`;
  });
}

function switchTab(tab) {
  clearExamTimer();
  ActiveSession = null;
  AppState.tab = tab;
  saveState();
  updateHud();
  render();
}

/* ============================================================================
   6. RENDER ROUTER
============================================================================ */
function render() {
  const root = document.getElementById('app-root');
  if (!root) return;
  if (ActiveSession) {
    if (ActiveSession.type === 'step_lesson') return renderStepLesson(root);
    if (ActiveSession.type === 'stage_cards') return renderStageCards(root);
    if (ActiveSession.type === 'stage_quiz') return renderAdaptiveQuiz(root);
    if (ActiveSession.type === 'exam') return renderExamSession(root);
    if (ActiveSession.type === 'exam_result') return renderExamResult(root);
  }
  if (AppState.tab === 'arena') return renderArenaHome(root);
  if (AppState.tab === 'exams') return renderExamsHome(root);
  if (AppState.tab === 'cheatsheet') return renderCheatSheet(root);
}

/* ============================================================================
   9. ADAPTIVE GAME QUIZ (SPACED LOOP + ZEN SHIELD + 50:50 HINT)
============================================================================ */
function startStageQuiz(stageId) {
  const stage = STAGES.find(s => s.id === stageId);
  const pool = ALL_QUESTIONS.filter(q => q.stage === stageId);
  // Prioritize unmastered questions first
  const sorted = [...pool].sort((a, b) => (AppState.qMastery[a.id] || 0) - (AppState.qMastery[b.id] || 0));
  const selected = shuffleArr(sorted.slice(0, 12));
  launchAdaptiveQuiz(`Kuis Adaptif · Stage ${stage.id}`, stage.pages, selected);
}

function startSmartQueue() {
  // Prioritize wrong pool first, then lowest mastery across all 120 questions
  const wrongQs = ALL_QUESTIONS.filter(q => AppState.qWrongPool.includes(q.id));
  const rest = ALL_QUESTIONS.filter(q => !AppState.qWrongPool.includes(q.id))
    .sort((a, b) => (AppState.qMastery[a.id] || 0) - (AppState.qMastery[b.id] || 0));
  const combined = [...shuffleArr(wrongQs), ...shuffleArr(rest.slice(0, 24))].slice(0, 12);
  launchAdaptiveQuiz('⚡ Latihan Cerdas (Smart Queue)', 'Hal. 2–20 · Prioritas Materi Lemah', combined);
}

function startWrongSniper(wrongIds, title) {
  const qs = ALL_QUESTIONS.filter(q => wrongIds.includes(q.id));
  if (qs.length === 0) {
    showToast('Tidak ada soal salah! Keren!', 'emerald');
    return;
  }
  launchAdaptiveQuiz(`🎯 ${title}`, `${qs.length} Soal Target`, shuffleArr(qs));
}

function launchAdaptiveQuiz(title, subtitle, questions, guidedStepId = null) {
  ActiveSession = {
    type: 'stage_quiz',
    title,
    subtitle,
    guidedStepId,
    queue: questions.map(q => ({ q, isRetry: false })),
    idx: 0,
    answered: null,
    eliminated: [],
    correctFirstTry: 0,
    totalInitial: questions.length,
    retriedCount: 0
  };
  render();
}

function startExamBank(bankId, mode, doShuffle) {
  clearExamTimer();
  const bank = EXAM_BANKS.find(b => b.id === bankId);
  const rawList = doShuffle ? shuffleArr(bank.questions) : [...bank.questions];
  const prepared = rawList.map(q => {
    // Optionally shuffle options while tracking new correct index
    const indexedOpts = q.opts.map((o, i) => ({ o, origIdx: i }));
    const finalOpts = doShuffle ? shuffleArr(indexedOpts) : indexedOpts;
    const newAns = finalOpts.findIndex(x => x.origIdx === q.ans);
    return {
      ...q,
      opts: finalOpts.map(x => x.o),
      ans: newAns
    };
  });

  ActiveSession = {
    type: 'exam',
    bank,
    mode, // 'practice' | 'sim'
    questions: prepared,
    idx: 0,
    answers: {},   // idx -> chosenOptIdx
    flags: {},     // idx -> boolean
    secondsLeft: mode === 'sim' ? 45 * 60 : null,
    showNav: false
  };

  if (mode === 'sim') {
    ExamTimerId = setInterval(() => {
      if (!ActiveSession || ActiveSession.type !== 'exam') {
        clearExamTimer();
        return;
      }
      ActiveSession.secondsLeft--;
      const tEl = document.getElementById('exam-timer');
      if (tEl) tEl.textContent = formatTime(ActiveSession.secondsLeft);
      if (ActiveSession.secondsLeft <= 0) {
        clearExamTimer();
        finishExamSession();
      }
    }, 1000);
  }
  render();
}

function formatTime(sec) {
  const s = Math.max(0, sec);
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const r = String(s % 60).padStart(2, '0');
  return `${m}:${r}`;
}

  });

  });
  document.getElementById('btn-next-exam')?.addEventListener('click', () => {
    if (s.idx < s.questions.length - 1) { s.idx++; render(); }
  });

    const unanswered = 40 - Object.keys(s.answers).length;

        'Kumpulkan Jawaban?',
        `Masih ada ${unanswered} soal yang belum dijawab. Tetap selesaikan dan hitung nilai sekarang?`,
        'Ya, Hitung Nilai',
        () => finishExamSession()
      );
    } else {
      finishExamSession();
    }
  };
  document.getElementById('btn-submit-exam').addEventListener('click', confirmSubmit);
  document.getElementById('btn-finish-bottom')?.addEventListener('click', confirmSubmit);

  root.querySelectorAll('[data-jump]').forEach(b => {
    b.addEventListener('click', () => { s.idx = Number(b.dataset.jump); render(); });
  });

  root.querySelectorAll('[data-exam-opt]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.examOpt);
      s.answers[s.idx] = idx;
      if (isPractice) {
        if (idx === q.ans) ZenAudio.correct(2);
        else ZenAudio.wrong();
      } else {
        ZenAudio.flip();
      }
      render();
    });
  });
}

function finishExamSession() {
  clearExamTimer();
  const s = ActiveSession;
  let correct = 0;
  const wrongIds = [];
  const stageBreakdown = {};
  STAGES.forEach(st => stageBreakdown[st.id] = { correct: 0, total: 0 });

  s.questions.forEach((q, i) => {
    const isOk = s.answers[i] === q.ans;
    stageBreakdown[q.stage].total++;
    if (isOk) {
      correct++;
      stageBreakdown[q.stage].correct++;
      AppState.qMastery[q.id] = Math.min((AppState.qMastery[q.id] || 0) + 1, 3);
      AppState.qWrongPool = AppState.qWrongPool.filter(id => id !== q.id);
    } else {
      wrongIds.push(q.id);
      if (!AppState.qWrongPool.includes(q.id)) AppState.qWrongPool.push(q.id);
    }
  });

  const scorePct = Math.round((correct / s.questions.length) * 100);
  const prev = AppState.bankStats[s.bank.id] || { best: null, attempts: 0, lastWrong: [] };
  AppState.bankStats[s.bank.id] = {
    best: prev.best === null ? scorePct : Math.max(prev.best, scorePct),
    attempts: prev.attempts + 1,
    lastWrong: wrongIds
  };
  addXp(correct * 4, `Selesai ${s.bank.code}`);
  ZenAudio.win();

  ActiveSession = {
    type: 'exam_result',
    bank: s.bank,
    questions: s.questions,
    answers: s.answers,
    correct,
    scorePct,
    wrongIds,
    stageBreakdown,
    filterWrongOnly: true
  };
  render();
}

      <button id="m-cancel" type="button" class="px-3.5 py-2 rounded-xl bg-night-800 hover:bg-night-700 border border-slate-700 text-xs font-semibold text-slate-300">Batal</button>
      <button id="m-ok" type="button" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-night-950 font-bold text-xs">${escapeHtml(okLabel)}</button>
    </div>
  `;
  backdrop.classList.remove('hidden');
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('m-ok').addEventListener('click', () => {
    closeModal();
    onOk();
  });
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
}

function openResetModal() {
  openModal(
    'Reset Semua Progres?',
    'XP, mastery soal, dan riwayat 3 bank soal akan dikembalikan ke 0. Lanjutkan?',
    'Ya, Reset',
    () => {
      AppState = JSON.parse(JSON.stringify(DefaultState));
      saveState();
      updateHud();
      render();
      showToast('Progres berhasil direset', 'sky');
    }
  );
}

/* ============================================================================
   13. BOOTSTRAP & EVENT WIRING
============================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('btn-lang').addEventListener('click', () => {
    const order = ['bi', 'jp', 'id'];
    AppState.lang = order[(order.indexOf(AppState.lang) + 1) % order.length];
    saveState();
    updateHud();
    render();
    showToast(`Mode Bahasa: ${AppState.lang === 'bi' ? 'Bilingual JP + ID' : (AppState.lang === 'jp' ? 'Jepang (Ujian)' : 'Indonesia')}`, 'sky');
  });

  document.getElementById('btn-sound').addEventListener('click', () => {
    AppState.soundOn = !AppState.soundOn;
    saveState();
    updateHud();
    if (AppState.soundOn) ZenAudio.flip();
  });

  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });

  updateHud();
  render();
});
</script>
</body>
</html>
