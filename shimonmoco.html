            transition: all 0.12s ease;

            transform: translateY(4px);
            box-shadow: 0 1px 0 #92400e, 0 2px 5px rgba(0,0,0,0.15);

        .btn-3d-green {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);

            transform: translateY(3px);
            box-shadow: 0 1px 0 #d6d3d1;

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }

        }
        .animate-pop {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

            0%, 100% { transform: scale(1); }

            animation: pulseGentle 2s infinite ease-in-out;

            playGamelanNote(523.25, 0.2); // Bunyi kenong sambutan

            // Cek apakah profil sudah ada di Cloud
            let loadedData = allCloudUsers[normId] || null;
            if (!loadedData && currentUser && db) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shimon_moco_users', normId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        loadedData = snap.data();

                    console.warn("Load fallback:", e);
                }
            }

            if (loadedData) {
                state.username = loadedData.username || cleanName;
                state.normalizedId = normId;
                state.completedChapters = Array.isArray(loadedData.completedChapters) ? loadedData.completedChapters : [];
                state.masteredAksara = Array.isArray(loadedData.masteredAksara) ? loadedData.masteredAksara : [];

                state.dialect = loadedData.dialect || 'jawa';
                showToast(`🎉 Sugeng Rawuh kembali, ${state.username}! Progres belajar berhasil dilanjutkan.`);
            } else {
                // Buat profil baru

        // ============================================================================
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Bunyi Denting Kenong / Saron Gamelan Halus
        function playGamelanNote(freq = 493.88, duration = 0.45) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                // Karakter suara metalofon gamelan (sine + overtone lembut)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(freq * 2.75, ctx.currentTime);

                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.06, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration * 0.5);

                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                osc2.connect(gain2);
                gain2.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc2.start();
                osc.stop(ctx.currentTime + duration);
                osc2.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        // Pelafalan Suara Lisan Jawa / Indonesia (Ramah Android & iOS)
        window.speakJavanese = function(text, forceAksaraId = null) {
            playGamelanNote(587.33, 0.15);
            if (!('speechSynthesis' in window)) {
                showToast(`🔊 Bunyi: "${text}"`);
                return;
            }
            try {
                window.speechSynthesis.cancel();
                let spokenText = text;
                if (forceAksaraId && AKSARA_DB[forceAksaraId]) {
                    const item = AKSARA_DB[forceAksaraId];
                    spokenText = state.dialect === 'jawa' ? item.ttsJawa : item.ttsIndo;
                }

                const utter = new SpeechSynthesisUtterance(spokenText);
                const voices = window.speechSynthesis.getVoices();
                // Prioritaskan suara Jawa (jv-ID) jika tersedia di HP Android, lalu Indonesia (id-ID)
                const jvVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('jv'));
                const idVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('id'));
                if (jvVoice) {
                    utter.voice = jvVoice;
                    utter.lang = 'jv-ID';
                } else if (idVoice) {
                    utter.voice = idVoice;
                    utter.lang = 'id-ID';
                } else {
                    utter.lang = 'id-ID';
                }

                // Kecepatan agak pelan dan jelas khusus untuk pendengaran Bapak-Bapak
                utter.rate = 0.82;
                utter.pitch = 0.96;
                window.speechSynthesis.speak(utter);
            } catch (e) {
                console.warn("TTS error:", e);
            }
        };

            state.quizAnswered = false;
            state.quizFeedback = null;
            renderMain();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            autoSpeakCurrentStep();

            state.activeChapterId = null;
            renderMain();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

            const chap = CHAPTERS.find(c => c.id === state.activeChapterId);
            if (!chap) return;
            const step = chap.steps[state.activeStepIndex];
            if (!step) return;

            setTimeout(() => {
                if (step.type === 'learn') {
                    speakJavanese('', step.aksaraId);
                } else if (step.tts) {
                    speakJavanese(step.tts);
                }
            }, 250);
        }

                                </button>
                            `).join('')}
                        </div>

                        ${renderQuizFeedbackBox()}
                    </div>
                `;
            }

            return `
                <div>
                    <!-- Bar Atas Pelajaran (Tombol Kembali & Indikator Langkah) -->
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <button onclick="window.exitChapter()" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-extrabold text-xs px-3 py-2 rounded-xl flex items-center gap-1">
                            <i class="ph-bold ph-arrow-left"></i> Daftar Bab
                        </button>
                        <div class="text-xs font-extrabold text-stone-700 truncate">
                            ${chap.title} • Langkah ${state.activeStepIndex + 1}/${totalSteps}
                        </div>
                    </div>

                    <!-- Progress Bar Langkah Bab -->
                    <div class="w-full h-3 bg-stone-200 rounded-full overflow-hidden mb-4 border border-stone-300">
                        <div class="h-full bg-amber-500 transition-all duration-300" style="width: ${stepPercent}%"></div>
                    </div>

                    ${stepContentHTML}
                </div>
            `;
        }

        function renderQuizFeedbackBox() {
            if (!state.quizFeedback) return '';
            const isCorrect = state.quizFeedback.correct;

            return `
                <div class="mt-4 p-4 rounded-2xl border-2 animate-pop ${isCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-950' : 'bg-amber-50 border-amber-500 text-amber-950'}">
                    <div class="font-extrabold text-base flex items-center gap-2">
                        <span class="text-2xl">${isCorrect ? '🎉' : '💡'}</span>
                        <span>${isCorrect ? 'MANTAP SEKALI! Jawaban Benar!' : 'Belum Tepat, Mari Kita Ingat Triknya:'}</span>
                    </div>
                    <p class="text-xs font-semibold mt-1 leading-relaxed">
                        ${state.quizFeedback.message}
                    </p>
                    ${isCorrect ? `
                        <button onclick="window.nextLessonStep()" class="btn-3d-green w-full mt-3 py-3.5 px-5 rounded-2xl text-white font-extrabold text-base flex items-center justify-center gap-2">
                            <span>LANJUT LANGKAH BERIKUTNYA</span>
                            <i class="ph-bold ph-arrow-right text-xl"></i>
                        </button>
                    ` : `
                        <p class="text-xs font-extrabold text-amber-800 mt-2">👆 Silakan sentuh jawaban yang benar di atas.</p>
                    `}
                </div>
            `;
        }

        window.completeLearnStep = async function(aksaraId) {
            if (aksaraId && !state.masteredAksara.includes(aksaraId)) {
                state.masteredAksara.push(aksaraId);
                state.xp += 10;
                await saveProgressToCloud();
            } else {
                playGamelanNote(587.33, 0.2);
            }
            window.nextLessonStep();
        };

        window.answerQuiz = async function(optionIndex) {
            const chap = CHAPTERS.find(c => c.id === state.activeChapterId);
            if (!chap) return;
            const step = chap.steps[state.activeStepIndex];
            if (!step || !step.options) return;

            const chosen = step.options[optionIndex];
            if (!chosen) return;

            if (chosen.correct) {
                playSuccessGamelan();
                state.quizAnswered = true;
                state.quizFeedback = {
                    correct: true,
                    selectedIndex: optionIndex,
                    message: chosen.hint || `Bacaan yang tepat adalah "${chosen.text || chosen.label}". Ingatan Anda makin kuat!`
                };
                if (step.tts) {
                    speakJavanese(step.tts);
                }
                state.xp += 15;
                await saveProgressToCloud();
            } else {
                playGentleRetrySound();
                state.quizFeedback = {
                    correct: false,
                    selectedIndex: optionIndex,
                    message: chosen.hint || `Coba perhatikan lagi petunjuk bentuk huruf di atas, pasti ketemu!`
                };
            }
            renderMain();
        };

        window.nextLessonStep = function() {
            state.activeStepIndex += 1;
            state.quizAnswered = false;
            state.quizFeedback = null;
            renderMain();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            autoSpeakCurrentStep();
        };

        window.prevLessonStep = function() {
            if (state.activeStepIndex > 0) {
                state.activeStepIndex -= 1;
                state.quizAnswered = false;
                state.quizFeedback = null;
                renderMain();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function renderChapterComplete(chap) {
            // Simpan bahwa bab ini sudah tamat
            if (!state.completedChapters.includes(chap.id)) {
                state.completedChapters.push(chap.id);
                chap.aksaraIds.forEach(id => {
                    if (!state.masteredAksara.includes(id)) {
                        state.masteredAksara.push(id);
                    }
                });
                state.xp += 50;
                saveProgressToCloud();
                playSuccessGamelan();
            }

            const nextChap = CHAPTERS.find(c => c.id === chap.id + 1);

            return `
                <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-emerald-500 text-center animate-pop my-2">
                    <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-5xl shadow-inner mb-3">
                        🎉
                    </div>
                    <span class="bg-emerald-100 text-emerald-900 font-extrabold text-xs px-3 py-1 rounded-full border border-emerald-300">
                        OTOMATIS TERSIMPAN DI AKUN ${state.username.toUpperCase()}
                    </span>
                    <h2 class="text-2xl font-extrabold text-stone-900 mt-2">
                        Luar Biasa, ${state.username}!
                    </h2>
                    <p class="text-sm font-bold text-emerald-800 mt-1">
                        ${chap.title} Berhasil Ditamatkan!
                    </p>
                    <p class="text-xs text-stone-600 mt-2 leading-relaxed">
                        Otak Anda sekarang sudah merekam bentuk dan bunyi huruf di bab ini. Mari lanjutkan agar semakin lancar membaca!
                    </p>

                    <div class="mt-6 space-y-3">
                        ${nextChap ? `
                            <button onclick="window.startChapter(${nextChap.id})" class="btn-3d-amber w-full py-4 px-5 rounded-2xl text-white font-extrabold text-base flex items-center justify-center gap-2">
                                <span>LANJUT KE ${nextChap.title.toUpperCase()}</span>
                                <i class="ph-bold ph-arrow-right text-xl"></i>
                            </button>
                        ` : ''}
                        <button onclick="window.exitChapter()" class="btn-3d-cream w-full py-3.5 px-5 rounded-2xl text-stone-800 font-extrabold text-sm flex items-center justify-center gap-2">
                            <i class="ph-bold ph-house text-lg"></i>
                            <span>KEMBALI KE HALAMAN UTAMA</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // 8. TAB 2: KAMUS TRIK OTAK (20 AKSARA + SANDHANGAN + TEBAK KARTU CEPAT)
        // ============================================================================
        function renderKamusTab() {
            if (state.flashcardMode) {
                return renderFlashcardDrill();
            }

            const carakanIds = [
                'ha','na','ca','ra','ka',
                'da','ta','sa','wa','la',
                'pa','dha','ja','ya','nya',
                'ma','ga','ba','tha','nga'
            ];
            const sandhanganIds = [
                'wulu','suku','taling','taling_tarung','pepet',
                'cecak','layar','wignyan','pangkon'
            ];

            return `
                <div class="animate-pop space-y-5">
                    <!-- Kartu Latihan Tebak Cepat -->
                    <div class="bg-gradient-to-r from-amber-700 to-amber-900 text-white rounded-3xl p-5 shadow-md border-2 border-amber-400">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <span class="text-[11px] bg-amber-400 text-amber-950 font-extrabold px-2.5 py-0.5 rounded-full">ASAH INGATAN</span>
                                <h3 class="text-lg font-extrabold mt-1">Tebak Kartu Kilat</h3>
                                <p class="text-xs text-amber-100 mt-0.5">Uji seberapa cepat mata Anda mengenali huruf yang sudah dipelajari.</p>
                            </div>
                            <button onclick="window.startFlashcardDrill()" class="btn-3d-amber px-4 py-3 rounded-2xl font-extrabold text-sm shrink-0 flex items-center gap-1.5">
                                <i class="ph-fill ph-lightning text-lg"></i> Mulai
                            </button>
                        </div>
                    </div>

                    <!-- Tabel 20 Aksara Dasar (Sentuh untuk Dengar & Lihat Trik) -->
                    <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-stone-200">
                        <h3 class="font-extrabold text-stone-900 text-base flex items-center gap-2">
                            <i class="ph-fill ph-grid-four text-amber-700 text-xl"></i>
                            <span>20 Aksara Jawa Dasar (Carakan)</span>
                        </h3>
                        <p class="text-xs text-stone-600 mt-0.5 mb-3">
                            👆 <strong>Sentuh kotak huruf mana saja</strong> untuk mendengar suaranya dan melihat Trik Otak-nya:
                        </p>

                        <div class="grid grid-cols-2 gap-2.5">
                            ${carakanIds.map(id => {
                                const item = AKSARA_DB[id];
                                const isMastered = state.masteredAksara.includes(id);
                                const soundLabel = state.dialect === 'jawa' ? item.jawa : item.latin;
                                return `
                                    <div onclick="window.showKamusDetail('${id}')"
                                        class="btn-3d-cream p-3 rounded-2xl cursor-pointer flex items-center gap-3 relative ${isMastered ? 'border-emerald-400 bg-emerald-50/40' : ''}">
                                        <div class="w-14 h-14 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center shrink-0 overflow-hidden">
                                            <span class="aksara-font text-2xl font-bold text-stone-900 whitespace-nowrap leading-none">${item.aksara}</span>
                                        </div>
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-1">
                                                <span class="font-extrabold text-stone-900 text-base">${soundLabel}</span>
                                                <i class="ph-fill ph-speaker-high text-amber-700 text-sm"></i>
                                            </div>
                                            <div class="text-xs font-bold text-stone-600 truncate">${item.ikon} ${item.benda}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Tabel Sandhangan (Topi, Sepatu, & Bumbu Akhir Kata) -->
                    <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-stone-200">
                        <h3 class="font-extrabold text-stone-900 text-base flex items-center gap-2">
                            <i class="ph-fill ph-magic-wand text-amber-700 text-xl"></i>
                            <span>9 Tanda Pengubah Bunyi (Sandhangan)</span>
                        </h3>
                        <p class="text-xs text-stone-600 mt-0.5 mb-3">
                            Tanda untuk mengubah vokal jadi I, U, É, O, E dan akhiran -NG, -R, -H, Mati:
                        </p>

                        <div class="space-y-2.5">
                            ${sandhanganIds.map(id => {
                                const item = AKSARA_DB[id];
                                return `
                                    <div onclick="window.showKamusDetail('${id}')"
                                        class="btn-3d-cream p-3.5 rounded-2xl cursor-pointer flex items-center justify-between gap-3">
                                        <div class="flex items-center gap-3">
                                            <div class="min-w-[4.2rem] px-3 py-2 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center shrink-0 overflow-hidden">
                                                <span class="aksara-font text-xl font-bold text-stone-900 whitespace-nowrap leading-none">${item.aksara}</span>
                                            </div>
                                            <div>
                                                <div class="font-extrabold text-stone-900 text-sm">${item.latin}</div>
                                                <div class="text-xs font-semibold text-stone-600">${item.ikon} ${item.benda}</div>
                                            </div>
                                        </div>
                                        <span class="bg-amber-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0 flex items-center gap-1">
                                            <i class="ph-fill ph-speaker-high"></i> Trik
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Modal Detail Kamus jika salah satu huruf diklik -->
                    <div id="kamus-detail-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                        <div id="kamus-detail-body" class="bg-white w-full max-w-sm rounded-3xl p-5 border-4 border-amber-400 shadow-2xl animate-pop"></div>
                    </div>
                </div>
            `;
        }

        window.showKamusDetail = function(id) {
            const item = AKSARA_DB[id];
            if (!item) return;
            speakJavanese('', id);
            const modal = document.getElementById('kamus-detail-modal');
            const body = document.getElementById('kamus-detail-body');
            if (!modal || !body) return;

            const soundLabel = state.dialect === 'jawa' ? `${item.jawa} (${item.latin})` : item.latin;

            body.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="bg-amber-100 text-amber-900 font-extrabold text-xs px-3 py-1 rounded-full">DETAIL TRIK OTAK</span>
                    <button onclick="document.getElementById('kamus-detail-modal').classList.add('hidden')" class="w-8 h-8 rounded-full bg-stone-200 text-stone-800 font-extrabold flex items-center justify-center">✕</button>
                </div>
                <div onclick="window.speakJavanese('', '${item.id}')" class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-4 text-center cursor-pointer">
                    <div class="aksara-font text-6xl font-bold text-stone-900">${item.aksara}</div>
                    <div class="mt-2 inline-flex items-center gap-1.5 bg-amber-600 text-white font-extrabold text-base px-4 py-1 rounded-xl">
                        <i class="ph-fill ph-speaker-high"></i> ${soundLabel}
                    </div>
                </div>
                <div class="mt-3 bg-stone-50 p-3.5 rounded-2xl border border-stone-200 text-sm space-y-2">
                    <div class="font-extrabold text-stone-900">${item.ikon} ${item.benda}</div>
                    <p class="text-xs text-stone-700 leading-relaxed">${item.trikOtak}</p>
                    <div class="text-xs font-bold text-amber-900 bg-amber-100 px-2.5 py-1.5 rounded-xl">Contoh: <span class="aksara-font">${item.contoh}</span></div>
                </div>
                <button onclick="document.getElementById('kamus-detail-modal').classList.add('hidden')" class="btn-3d-amber w-full mt-4 py-3 rounded-2xl text-white font-extrabold text-sm">
                    TUTUP & KEMBALI KE KAMUS
                </button>
            `;
            modal.classList.remove('hidden');
        };

        // Fitur Tebak Kartu Kilat di dalam Tab Kamus
        window.startFlashcardDrill = function() {
            state.flashcardMode = true;
            generateNextFlashcard();
            renderMain();
        };

        function generateNextFlashcard() {
            const keys = Object.keys(AKSARA_DB);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const target = AKSARA_DB[randomKey];

            // Ambil 2 pengecoh acak
            const distractors = keys
                .filter(k => k !== randomKey)
                .sort(() => 0.5 - Math.random())
                .slice(0, 2)
                .map(k => AKSARA_DB[k]);

            const choices = [target, ...distractors].sort(() => 0.5 - Math.random());
            state.flashcardData = {
                target,
                choices,
                answered: false,
                correct: false
            };
        }

        window.answerFlashcard = function(chosenId) {
            if (!state.flashcardData) return;
            const isCorrect = chosenId === state.flashcardData.target.id;
            state.flashcardData.answered = true;
            state.flashcardData.correct = isCorrect;

            if (isCorrect) {
                playSuccessGamelan();
                speakJavanese('', state.flashcardData.target.id);
                state.xp += 10;
                saveProgressToCloud();
            } else {
                playGentleRetrySound();
            }
            renderMain();
        };

        window.nextFlashcard = function() {
            generateNextFlashcard();
            renderMain();
        };

        function renderFlashcardDrill() {
            const fc = state.flashcardData;
            if (!fc) return '';

            return `
                <div class="animate-pop">
                    <div class="flex items-center justify-between mb-3">
                        <button onclick="state.flashcardMode = false; renderMain();" class="bg-stone-200 text-stone-800 font-extrabold text-xs px-3 py-2 rounded-xl flex items-center gap-1">
                            <i class="ph-bold ph-arrow-left"></i> Kembali ke Kamus
                        </button>
                        <span class="text-xs font-extrabold text-amber-800">⚡ Latihan Tebak Kartu Kilat</span>
                    </div>

                    <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-amber-300 text-center">
                        <p class="text-xs font-bold text-stone-500">Ingat bentuk bendanya! Apa bunyi aksara di bawah ini?</p>

                        <div onclick="window.speakJavanese('', '${fc.target.id}')"
                            class="mt-3 bg-amber-50 border-4 border-amber-400 rounded-3xl p-6 cursor-pointer overflow-hidden">
                            <div class="aksara-font text-6xl font-bold text-stone-900 whitespace-nowrap">${fc.target.aksara}</div>
                            <div class="text-xs font-bold text-amber-800 mt-2">💡 Petunjuk Benda: ${fc.target.ikon} ${fc.target.benda}</div>
                        </div>

                        <div class="mt-4 space-y-2.5">
                            ${fc.choices.map(c => {
                                const label = state.dialect === 'jawa' ? `${c.jawa} (${c.benda})` : `${c.latin} (${c.benda})`;
                                return `
                                    <button onclick="window.answerFlashcard('${c.id}')"
                                        class="w-full p-4 rounded-2xl border-2 font-extrabold text-base flex items-center justify-between ${
                                            fc.answered && c.id === fc.target.id
                                                ? 'bg-emerald-100 border-emerald-600 text-emerald-950'
                                                : 'btn-3d-cream text-stone-900'
                                        }">
                                        <span>${label}</span>
                                        <i class="ph-bold ph-hand-tap text-xl text-amber-700"></i>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${fc.answered ? `
                            <div class="mt-4 p-4 rounded-2xl ${fc.correct ? 'bg-emerald-50 border-2 border-emerald-500' : 'bg-amber-50 border-2 border-amber-500'} text-left">
                                <div class="font-extrabold text-sm">${fc.correct ? '✅ Tepat Sekali!' : '💡 Jawabannya: ' + fc.target.latin}</div>
                                <p class="text-xs text-stone-700 mt-1">${fc.target.trikOtak}</p>
                                <button onclick="window.nextFlashcard()" class="btn-3d-green w-full mt-3 py-3 rounded-2xl text-white font-extrabold text-sm">
                                    KARTU BERIKUTNYA ➡️
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // 9. TAB 3: WARUNG BACA (LATIHAN MEMBACA MENU & KALIMAT SEHARI-HARI)
        // ============================================================================
        function renderWarungTab() {
            return `
                <div class="animate-pop space-y-4">
                    <div class="bg-amber-900 text-amber-50 rounded-3xl p-5 shadow-md border-2 border-amber-600">
                        <div class="flex items-center gap-3">
                            <div class="text-4xl">☕</div>
                            <div>
                                <h2 class="text-lg font-extrabold text-white">Warung Baca "Shimon Moco"</h2>
                                <p class="text-xs text-amber-200 leading-relaxed mt-0.5">
                                    Tempat melatih mata membaca papan menu warung dan kalimat Jawa sehari-hari. Coba eja dulu dalam hati, lalu sentuh <strong>"Lihat Cara Baca & Suara"</strong>!
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3.5">
                        ${WARUNG_ITEMS.map((item, index) => {
                            const isRevealed = !!state.revealedWarung[index];
                            return `
                                <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-stone-200">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="bg-amber-100 text-amber-900 font-extrabold text-[11px] px-2.5 py-0.5 rounded-full border border-amber-300">
                                            ${item.kategori}
                                        </span>
                                        <button onclick="window.speakJavanese('${item.latin}')" class="bg-amber-600 text-white px-3 py-1 rounded-xl text-xs font-extrabold flex items-center gap-1">
                                            <i class="ph-fill ph-speaker-high"></i> Bunyikan
                                        </button>
                                    </div>

                                    <!-- Tulisan Aksara Jawa Besar -->
                                    <div onclick="window.toggleWarungReveal(${index}, '${item.latin}')"
                                        class="bg-amber-50/70 border-2 border-amber-300 rounded-2xl p-4 text-center cursor-pointer">
                                        <div class="aksara-font text-4xl font-bold text-stone-900">${item.aksara}</div>
                                    </div>

                                    <!-- Tombol Buka/Tutup Cara Baca -->
                                    <button onclick="window.toggleWarungReveal(${index}, '${item.latin}')"
                                        class="mt-3 w-full py-2.5 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1.5 ${isRevealed ? 'bg-emerald-100 text-emerald-900 border border-emerald-400' : 'btn-3d-cream text-stone-800'}">
                                        <i class="ph-bold ${isRevealed ? 'ph-eye-slash' : 'ph-eye'} text-base"></i>
                                        <span>${isRevealed ? 'SEMBUNYIKAN CARA BACA' : 'SENTUH UNTUK LIHAT CARA BACA & SUARA'}</span>
                                    </button>

                                    ${isRevealed ? `
                                        <div class="mt-3 p-3.5 bg-emerald-50 border-2 border-emerald-400 rounded-2xl animate-pop">
                                            <div class="text-lg font-extrabold text-emerald-950 flex items-center justify-between">
                                                <span>📖 Dibaca: "${item.latin}"</span>
                                            </div>
                                            <div class="text-xs font-bold text-amber-900 mt-1 bg-white px-2.5 py-1.5 rounded-xl border border-emerald-200">
                                                🧩 Ejaan Per Suku Kata: <span class="aksara-font">${item.pecah}</span>
                                            </div>
                                            <div class="text-xs text-stone-600 font-semibold mt-1.5">
                                                Artinya: ${item.arti}
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        window.toggleWarungReveal = function(index, latinText) {
            state.revealedWarung[index] = !state.revealedWarung[index];
            if (state.revealedWarung[index]) {
                speakJavanese(latinText);
            } else {
                playGamelanNote(440, 0.1);
            }
            renderMain();
        };

        // Jalankan Aplikasi saat halaman selesai dimuat
        window.onload = async function() {
            // Preload daftar suara TTS pada Android/iOS
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
            renderMain();
            await initFirebase();
        };
    </script>
</body>
</html>
